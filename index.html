<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-Pesa Wi-Fi Access</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f2f5f9;margin:0;display:grid;min-height:100vh;place-items:center;color:#172033}
main{background:white;width:min(92vw,420px);box-sizing:border-box;padding:26px;border-radius:18px;box-shadow:0 8px 35px #0001}
h1{font-size:1.5rem;margin:0 0 8px}p{color:#5b6575}label{display:block;font-weight:600;margin:16px 0 6px}
select,input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #cbd2dc;font:inherit}
button{margin-top:18px;border:0;background:#087f5b;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}
#message{white-space:pre-wrap;margin-top:14px;font-size:.95rem}
.small{font-size:.8rem;color:#697586}
</style></head>
<body><main>
<h1>Connect to Wi-Fi</h1><p>Choose a package and pay with M-Pesa.</p>
<form id="payForm">
<label for="phone">M-Pesa phone number</label><input id="phone" name="phone" inputmode="tel" placeholder="07XXXXXXXX" required>
<label for="package">Internet package</label>
<select id="package" name="packageId">
<option value="1h">1 Hour — KSh 20</option><option value="5h">5 Hours — KSh 50</option><option value="24h">24 Hours — KSh 100</option>
</select>
<button id="payButton" type="submit">Pay with M-Pesa</button>
</form><div id="message" role="status"></div>
<p class="small">Access is enabled only after Safaricom confirms payment and the router creates your account. Keep your M-Pesa receipt if there is a delay.</p>
</main>
<script>
const qs = new URLSearchParams(location.search);
const mac = (qs.get("mac") || "").toLowerCase();
const ip = qs.get("ip") || "";
const loginUrl = qs.get("loginUrl") || "";
const form = document.getElementById("payForm");
const button = document.getElementById("payButton");
const message = document.getElementById("message");
function safeLoginUrl(raw) {
  try {
    const u = new URL(raw);
    // Only accept the local router's private HTTP login endpoint.
    if (u.protocol !== "http:" || !/^192\.168\.100\.\d+$/.test(u.hostname) || !u.pathname.includes("/login")) return null;
    return u;
  } catch { return null; }
}
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  message.textContent = "Sending STK Push…";
  try {
    const r = await fetch("/api/stk", {method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({phone:document.getElementById("phone").value,packageId:document.getElementById("package").value,mac,ip})});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Could not start payment.");
    message.textContent = data.customerMessage || "Check your phone and enter your M-Pesa PIN.";
    const started = Date.now();
    while (Date.now() - started < 5 * 60 * 1000) {
      await new Promise(resolve => setTimeout(resolve, 3000));
      const s = await fetch("/api/status", {method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({checkoutRequestId:data.checkoutRequestId,statusToken:data.statusToken})});
      const state = await s.json();
      if (state.status === "ready") {
        message.textContent = "Payment confirmed. Connecting…";
        const target = safeLoginUrl(loginUrl);
        if (!target) {
          message.textContent = "Payment confirmed. Use these credentials on the hotspot login page:\nUsername: " + state.username + "\nPassword: " + state.password;
          break;
        }
        target.searchParams.set("username", state.username);
        target.searchParams.set("password", state.password);
        target.searchParams.set("dst", "http://neverssl.com/");
        location.href = target.toString();
        return;
      }
      if (["failed","review","expired"].includes(state.status)) {
        message.textContent = state.message || "Payment could not be completed.";
        break;
      }
      message.textContent = state.message || "Waiting for payment confirmation…";
    }
  } catch (e) {
    message.textContent = e.message || "An error occurred.";
  } finally { button.disabled = false; }
});
</script></body></html>
